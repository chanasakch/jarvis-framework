name: Deploy site

# Path-filtered on push to main: the site's own source, the framework source it
# generates reference content from (.claude/**, .jarvis/**), and CHANGELOG.md. Also
# deploys on every published GitHub Release, regardless of which paths changed, and can
# be re-run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".claude/**"
      - ".jarvis/**"
      - "CHANGELOG.md"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a newer push should win, not queue behind an
# older one still building.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    # Job-level, not just on the build step: `check:links` below also needs it to
    # resolve the same basePath-prefixed hrefs the build just produced — each `run:`
    # step's own `env:` block does not carry over to the next step.
    env:
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The content generator shells out to `node .jarvis/scripts/jarvis.js` (parse-cli.ts)
      # to read the real CLI reference — that script requires the `yaml` package from
      # .jarvis/'s own node_modules, which is gitignored and never installed by the
      # site's own `npm ci` above.
      - name: Install .jarvis CLI dependencies
        working-directory: .jarvis
        run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # Runs generate -> search-index -> i18n parity -> route parity -> next build (see
      # package.json). SITE_BASE_PATH is a repo/environment variable (Settings ->
      # Secrets and variables -> Actions -> Variables): set it to "/<repo-name>" for a
      # project-page deploy (the default for org.github.io/<repo-name>/), or leave unset
      # for a user/org page or a custom domain served from "/".
      - run: npm run build

      # Needs the real static export in out/, so it runs after build, not before —
      # despite "typecheck -> lint -> i18n check -> link check -> build" reading as a
      # strict pipeline order, link checking a page's rendered anchors is only possible
      # once next build has produced them.
      - run: npm run check:links

      # Custom domain only: SITE_CNAME is an optional repo variable (e.g. "docs.example.com").
      # Leave it unset to deploy at the default *.github.io URL.
      - name: Write CNAME
        if: ${{ vars.SITE_CNAME != '' }}
        run: echo "${{ vars.SITE_CNAME }}" > out/CNAME

      # Without this, GitHub Pages' Jekyll processing drops any output path starting
      # with an underscore — including every asset under _next/ — and the deployed site
      # 404s on all of its JS/CSS.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  # The e2e suite is the only check covering hydration, keyboard operation and axe
  # accessibility -- typecheck, lint and check:links all pass on a page whose JavaScript
  # never runs. It stayed local-only until DECISIONS.md D-050, where a stray `next dev`
  # server made every local run grade the wrong build for an unknown period, with no
  # second opinion anywhere to catch it.
  #
  # It builds WITHOUT SITE_BASE_PATH and tests the export at the server root. The
  # behaviour it checks does not depend on the deploy basePath, and testing at the root
  # keeps every spec free of prefix handling -- the specs navigate to `/docs/...`, which
  # against a basePath build resolves to nothing (the first CI run failed exactly this
  # way: `<html lang>` came back null because the page served at `/` was not the page).
  # The basePath-prefixed link graph of the real deploy artifact is covered by
  # check:links in the build job instead, which is the tool that exists for it (D-044).
  #
  # Runs in parallel with build; deploy waits on both, so a failure here blocks the deploy.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Same reason as the build job: the content generator shells out to the .jarvis CLI,
      # which needs its own gitignored node_modules.
      - name: Install .jarvis CLI dependencies
        working-directory: .jarvis
        run: npm ci

      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

      # Only Chromium: playwright.config.ts defines light and dark projects, both on
      # Desktop Chrome. Run unconditionally even on a cache hit -- the cache holds the
      # browser under ~/.cache/ms-playwright but not the apt libraries it links against,
      # and the command skips the download when the browser is already present.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e and accessibility tests
        run: npx playwright test

      # Only on failure: a runner has no terminal to scroll back through, and the trace
      # and screenshot for each failed assertion live in the HTML report.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
